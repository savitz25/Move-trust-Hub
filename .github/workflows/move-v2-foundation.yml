name: Move V2 foundation

on:
  pull_request:
    paths:
      - 'app/(move)/experience-lab/**'
      - 'lib/move-v2/**'
      - 'scripts/move-v2/**'
      - 'tests/move-v2*.test.ts'
      - 'tests/browser/move-v2*.spec.ts'
      - 'supabase/migrations/*move_v2*.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.move-v2.json'
      - '.github/workflows/move-v2-foundation.yml'
  push:
    branches: [move-2.0]

permissions:
  contents: read

jobs:
  domain-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:move-v2
      - run: npm run typecheck:move-v2
      - run: npm run test:move-v2
      - name: Production build (bounded retry for next/font network fetch)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 2
          command: npm run build
        env:
          MOVE_ENABLE_V2: 'true'
          MOVE_ENABLE_REAL_PROVIDER_DATA: 'true'
          MOVE_ENABLE_PUBLIC_READS: 'true'
          MOVE_ENABLE_SAME_URL_COMPOSITION: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'https://arepfylnilkjmyduhwbz.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-build-placeholder-not-used-by-move-v2'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:move-v2
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://arepfylnilkjmyduhwbz.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-build-placeholder-not-used-by-move-v2'
      - run: npm run test:browser:move-v2-review
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://arepfylnilkjmyduhwbz.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-build-placeholder-not-used-by-move-v2'
      - run: npm run validate:seo:move-v2
      - run: npm run test:browser:move-v2-migration
      - run: npm run test:browser:move-v2-launch
      - run: npm run test:browser:move-v2-rollback
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://arepfylnilkjmyduhwbz.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-build-placeholder-not-used-by-move-v2'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: move-v2-browser-qa
          path: |
            test-results/task-013
            playwright-report
          retention-days: 14
      - name: Production and real-data gates default off
        run: |
          grep -q '^MOVE_ENABLE_V2=false$' .env.example
          grep -q '^MOVE_ENABLE_REAL_PROVIDER_DATA=false$' .env.example
          grep -q '^MOVE_ENABLE_GOOGLE_ENRICHMENT=false$' .env.example
          grep -q '^MOVE_ENABLE_WEBSITE_ENRICHMENT=false$' .env.example
          grep -q '^MOVE_ENABLE_INTERNAL_REVIEW=false$' .env.example
      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical
