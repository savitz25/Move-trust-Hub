name: Move network metrics

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stale-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Fail if publication catalogs diverge from the checked-in manifest
        run: node scripts/assert_network_metrics_v1.mjs
      - name: Homepage consumes v1
        run: npx --yes tsx --test lib/intelligence/home-page-contract.test.ts lib/intelligence/home-snapshot.test.ts
      - name: Grain-safety unit tests
        run: npx --yes tsx --test scripts/test_move_network_metrics.ts

      - name: Exact identifier and canonical Move request behavior (TH-SEARCH-R1-001)
        run: npm run check:th-search-r1-001

      - name: Source-backed named-company behavior (TH-SEARCH-R1-005)
        run: npm run check:th-search-r1-005

      - name: Source-association integrity (TH-SEARCH-R1-006)
        run: npm run check:th-search-r1-006
