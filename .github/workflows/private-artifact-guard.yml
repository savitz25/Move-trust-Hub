name: GB3 Private Artifact Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  private-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject environment captures and local environment files
        run: python scripts/guard-private-artifacts.py
