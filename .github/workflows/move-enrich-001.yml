name: Move enrich 001 loader

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Loader tests
        run: npm run check:move-enrich-001
